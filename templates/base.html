{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cancha Ya{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'inicio' %}">CANCHA YA</a>
        <nav aria-label="Navegación principal">
            <a href="{% url 'inicio' %}">Canchas</a>
            <a href="{% url 'lista_reservas' %}">Reservas</a>
            <a href="{% url 'disponibilidad' %}">Disponibilidad</a>
            <a class="nav-action" href="{% url 'crear_reserva' %}">Reservar</a>
        </nav>
    </header>
    <main class="page-shell">
        {% if messages %}
            {% for message in messages %}
                <div class="notice" role="status">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
