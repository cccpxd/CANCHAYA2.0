{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cancha Ya{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'reservas/styles.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'reservas:inicio' %}">CANCHA YA</a>
        <nav>
            <a href="{% url 'reservas:inicio' %}">Canchas</a>
            <a href="{% url 'reservas:lista' %}">Reservas</a>
            <a class="nav-action" href="{% url 'reservas:crear' %}">Reservar</a>
        </nav>
    </header>
    <main class="page-shell">
        {% if messages %}
            {% for message in messages %}
                <div class="notice">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
